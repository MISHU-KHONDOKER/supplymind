# ==============================================================================
# SupplyMind Backend — pyproject.toml
# ==============================================================================
# Modern Python project configuration. All tool settings live here:
# Ruff, Black, isort, mypy, pytest, coverage.
#
# Reference: https://peps.python.org/pep-0621/
# ==============================================================================

# ------------------------------------------------------------------------------
# Build System
# ------------------------------------------------------------------------------
[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

# ------------------------------------------------------------------------------
# Project Metadata
# ------------------------------------------------------------------------------
[project]
name = "supplymind"
version = "0.1.0"
description = "Autonomous multi-agent AI platform for supply chain intelligence"
readme = "../README.md"
license = { file = "../LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Mohyminul Islam", email = "sailormishu50@gmail.com" }
]
keywords = [
    "llm",
    "agentic-ai",
    "multi-agent",
    "supply-chain",
    "langgraph",
    "rag",
    "anomaly-detection",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/MISHU-KHONDOKER/supplymind"
Repository = "https://github.com/MISHU-KHONDOKER/supplymind"
Issues = "https://github.com/MISHU-KHONDOKER/supplymind/issues"

# ------------------------------------------------------------------------------
# Ruff — Linter and Formatter
# ------------------------------------------------------------------------------
# Ruff is a fast Python linter written in Rust. It replaces flake8, isort,
# pyupgrade, autoflake, and many others with a single tool.
#
# Reference: https://docs.astral.sh/ruff/

[tool.ruff]
# Target Python version — Ruff applies rules appropriate for this version
target-version = "py310"

# Line length — slightly longer than PEP 8 (79) to accommodate modern screens
line-length = 100

# Directories to scan
src = ["app", "tests"]

# Exclude these directories from linting
extend-exclude = [
    ".venv",
    "venv",
    "__pycache__",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    "data",
    "eval_outputs",
    "benchmarks",
]

# ------------------------------------------------------------------------------
# Ruff Linting Rules
# ------------------------------------------------------------------------------
[tool.ruff.lint]
# Rules to enable — each prefix is a rule category
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes (logical errors)
    "I",      # isort (import sorting)
    "B",      # flake8-bugbear (likely bugs)
    "C4",     # flake8-comprehensions (better list/dict comprehensions)
    "UP",     # pyupgrade (modernize Python syntax)
    "N",      # pep8-naming (naming conventions)
    "S",      # flake8-bandit (security issues)
    "A",      # flake8-builtins (don't shadow builtins)
    "RET",    # flake8-return (return statement issues)
    "SIM",    # flake8-simplify (code simplification)
    "TID",    # flake8-tidy-imports (import hygiene)
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib (prefer pathlib over os.path)
    "ERA",    # eradicate (commented-out code)
    "PL",     # Pylint (selected rules)
    "RUF",    # Ruff-specific rules
]

# Rules to explicitly ignore
ignore = [
    "E501",   # Line too long — handled by formatter
    "S101",   # Use of assert — fine in tests
    "PLR0913", # Too many arguments — common in FastAPI handlers
    "PLR2004", # Magic value in comparison — too noisy
    "RUF012", # Mutable class defaults — Pydantic uses these
    "B008",   # Function call in default argument — FastAPI Depends pattern
]

# Allow auto-fix for these rules when running `ruff check --fix`
fixable = ["ALL"]
unfixable = []

# ------------------------------------------------------------------------------
# Per-File Ignores
# ------------------------------------------------------------------------------
[tool.ruff.lint.per-file-ignores]
# Tests can have additional flexibility
"tests/**/*.py" = [
    "S101",    # asserts are the whole point of tests
    "PLR2004", # magic values are fine in tests
    "ARG",     # unused fixture arguments are common
]

# __init__.py files often have unused imports for re-export
"**/__init__.py" = ["F401"]

# Migration files (if you ever add them)
"**/migrations/*.py" = ["E501", "N806"]

# ------------------------------------------------------------------------------
# isort Integration (inside Ruff)
# ------------------------------------------------------------------------------
[tool.ruff.lint.isort]
# Treat these as first-party — they're our own code
known-first-party = ["app"]

# Force imports to be on separate lines (one per import)
force-single-line = false

# Lines between import groups
lines-after-imports = 2

# ------------------------------------------------------------------------------
# Ruff Formatter
# ------------------------------------------------------------------------------
[tool.ruff.format]
# Use double quotes (consistent with Black's default)
quote-style = "double"

# Indent with spaces (4) — matches PEP 8
indent-style = "space"

# Respect existing magic trailing commas (forces multiline)
skip-magic-trailing-comma = false

# Auto-detect line endings (LF on Unix, CRLF on Windows)
line-ending = "auto"

# ------------------------------------------------------------------------------
# Black — Code Formatter
# ------------------------------------------------------------------------------
# Black is the uncompromising Python formatter. Despite Ruff having its own
# formatter, we keep Black configured for compatibility with editor plugins
# and any tooling that doesn't yet support Ruff's formatter.
#
# Reference: https://black.readthedocs.io/

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  | \.git
  | \.venv
  | venv
  | __pycache__
  | \.mypy_cache
  | \.pytest_cache
  | \.ruff_cache
  | data
  | eval_outputs
  | benchmarks
)/
'''

# ------------------------------------------------------------------------------
# isort — Import Sorter
# ------------------------------------------------------------------------------
# Standalone isort config for editors that don't use Ruff's isort integration.
# Should match the Ruff isort settings above for consistency.
#
# Reference: https://pycqa.github.io/isort/

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
default_section = "THIRDPARTY"
force_single_line = false
lines_after_imports = 2
combine_as_imports = true
include_trailing_comma = true

# ------------------------------------------------------------------------------
# mypy — Static Type Checker
# ------------------------------------------------------------------------------
# mypy verifies type hints across the codebase. Strict mode catches the
# most issues but requires fully typed code.
#
# Reference: https://mypy.readthedocs.io/

[tool.mypy]
python_version = "3.10"
mypy_path = "app"
files = ["app", "tests"]

# Strict mode — enables all strictness flags
strict = true

# These are implied by strict = true but listed for documentation
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_equality = true
extra_checks = true

# Output configuration
show_error_codes = true
show_column_numbers = true
pretty = true
color_output = true

# Cache for faster subsequent runs
cache_dir = ".mypy_cache"
incremental = true

# ------------------------------------------------------------------------------
# mypy Per-Module Overrides
# ------------------------------------------------------------------------------
# Third-party libraries without type stubs require relaxed settings to
# avoid noise. List them here as needed.

[[tool.mypy.overrides]]
module = [
    "chromadb.*",
    "sentence_transformers.*",
    "transformers.*",
    "langchain.*",
    "langgraph.*",
    "tavily.*",
    "circuitbreaker.*",
]
ignore_missing_imports = true

# Tests can be slightly more relaxed
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

# ------------------------------------------------------------------------------
# pytest — Test Runner
# ------------------------------------------------------------------------------
# pytest configuration. The conftest.py file at tests/ root handles fixtures
# and plugin setup.
#
# Reference: https://docs.pytest.org/

[tool.pytest.ini_options]
# Test discovery — where pytest looks for tests
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Required minimum pytest version
minversion = "8.0"

# Add the app directory to PYTHONPATH so tests can import from `app`
pythonpath = ["."]

# Command-line options applied to every test run
addopts = [
    "--strict-markers",       # Fail on unregistered markers
    "--strict-config",        # Fail on unknown config options
    "--verbose",              # Verbose output
    "--tb=short",             # Short tracebacks (full is too noisy)
    "--showlocals",           # Show local variables in tracebacks
    "--color=yes",            # Colored output
    "--durations=10",         # Show 10 slowest tests
    "-ra",                    # Show summary of all test outcomes except passes
]

# Markers for test categorization — must be registered to use
markers = [
    "unit: Fast isolated unit tests (default)",
    "integration: Integration tests requiring external services",
    "slow: Tests that take more than 5 seconds",
    "llm: Tests that make actual LLM calls (skipped in CI by default)",
    "anomaly: Tests for the anomaly detection module",
    "rag: Tests for the RAG pipeline",
    "agent: Tests for individual agents",
]

# Async test mode
asyncio_mode = "auto"

# Timeout (in seconds) — kills hanging tests
timeout = 60
timeout_method = "thread"

# Warning filters
filterwarnings = [
    # Treat unhandled warnings as errors
    "error",
    # Suppress known third-party warnings we can't fix
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::DeprecationWarning:langchain.*",
    "ignore::PendingDeprecationWarning",
    "ignore::UserWarning:huggingface_hub.*",
]

# Log capture during tests
log_cli = false
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

# ------------------------------------------------------------------------------
# Coverage.py — Test Coverage Measurement
# ------------------------------------------------------------------------------
# Coverage tracks which lines of code execute during tests.
#
# Reference: https://coverage.readthedocs.io/

[tool.coverage.run]
source = ["app"]
branch = true
parallel = true

omit = [
    "*/tests/*",
    "*/conftest.py",
    "*/__init__.py",
    "*/main.py",
    "*/migrations/*",
    "*/data/synthetic/generator.py",
]

[tool.coverage.report]
# Fail if coverage drops below this threshold
fail_under = 70

# Show lines that aren't covered
show_missing = true

# Skip files that are 100% covered (less noise in report)
skip_covered = false

# Skip empty files
skip_empty = true

# Precision of percentages (decimal places)
precision = 2

# Patterns of lines to exclude from coverage entirely
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise NotImplementedError",
    "raise AssertionError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "\\.\\.\\.",
    "pass",
]

[tool.coverage.html]
directory = "coverage_html"
title = "SupplyMind Backend Coverage Report"

[tool.coverage.xml]
output = "coverage.xml"